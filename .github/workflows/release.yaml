name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@3b8ffc4e0443eb0241f4d7d2beb7b97e011c0c00 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
