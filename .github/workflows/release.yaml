name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@543dc5e46ae2b7c9dc68df37f47a10464f8d3318 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
