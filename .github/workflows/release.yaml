name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@1ee03d5f3cbb540a1360e69cd9b30ff3fff55466 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
