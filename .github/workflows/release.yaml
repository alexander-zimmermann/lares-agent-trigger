name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@bd9f50fb8d94fc5f209278f6244e1e97d7c79ff0 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
