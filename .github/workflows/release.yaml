name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/.github/.github/workflows/sidecar-python-release.yaml@0b041788600c08a3cd12d57fa0c59bcb49d8b259 # v1.0.0
    with:
      tag: ${{ github.event.inputs.tag || '' }}
