name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@0d2eb64c80ff2f5b4e0a34cacf0845ce5bec5232 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
