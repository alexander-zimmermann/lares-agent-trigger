name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@53eae1e6dcdfaea89b4303e1e4a029f40fe48f23 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
