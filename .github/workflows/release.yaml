name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@5da4da181b3ae8026f80daa3ab8d117d1c69c2c3 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
