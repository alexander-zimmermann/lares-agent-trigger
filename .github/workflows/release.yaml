name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@c9ca0aa8b33e43e4966895fdecaaf98bcb6c992d # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
