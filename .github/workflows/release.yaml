name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@7d3fe13e1ec0810e4f4e39d29060e5f0b48f3da7 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
