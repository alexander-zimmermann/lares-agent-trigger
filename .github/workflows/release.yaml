name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@a0f2d2479c7dde828e9620eb9eff9b021c3d5a66 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
