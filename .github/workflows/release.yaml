name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@c0bfcb996a50b305ff222aa449a3fc772b92cdc2 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
