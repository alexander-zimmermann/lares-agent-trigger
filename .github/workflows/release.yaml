name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/.github/.github/workflows/sidecar-python-release.yaml@5eadf32cfce11f0732d1352635debbe9a12f6a75 # v1.0.1
    with:
      tag: ${{ github.event.inputs.tag || '' }}
