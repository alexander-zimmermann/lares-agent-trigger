name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@ddd0ef657b1b16f76b1726e64b1c156b4cb8f85b # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
