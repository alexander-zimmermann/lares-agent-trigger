name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@c058b6805a3a29aea01d1b8b4a4cad9519ce38ae # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
