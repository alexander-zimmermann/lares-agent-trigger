name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/.github/.github/workflows/sidecar-python-release.yaml@8b46798f27199f4c0e1d937c3ec6e6f9424c4fdf # v1.0.2
    with:
      tag: ${{ github.event.inputs.tag || '' }}
