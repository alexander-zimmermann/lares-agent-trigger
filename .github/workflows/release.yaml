name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@7fe931b4bfd8a8a960b302fb9a1125437aa31ef7 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
