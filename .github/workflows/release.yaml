name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@9b33f14061e6c1f6e1e1f00b0e3503e4d22fc7a1 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
