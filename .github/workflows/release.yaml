name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@af6f9f150ed71fc1c39cc409f0b1f535e2a698e1 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
