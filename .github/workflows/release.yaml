name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@f0c89eb8c19186b56037fe87424bb4bcb9a7f8fd # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
