name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@90b174b20d3463c3b3f1635d5c2f030ff3a5ab45 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
