name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@6d60fbf9a06b55c5d06d5aa8318b6b6d3b080b14 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
