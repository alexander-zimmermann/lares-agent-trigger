[project]
name = "lares-agent-trigger"
version = "0.35.0"
description = "Turns episode events into Hermes runs and writes every run into the agent ledger"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.15.2"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
]
dependencies = [
    "httpx>=0.28.1",
    "nats-bridge-core @ git+https://github.com/alexander-zimmermann/nats-bridge-core@v0.9.0",
    "nats-py[nkeys]>=2.16.0",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0",
    "respx>=0.23.1",
    "aiosmtpd>=1.4.6",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "types-PyYAML>=6.0.12.20260906",
]

[project.scripts]
lares-agent-trigger = "lares_agent_trigger.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# nats-bridge-core is a git tag, not a PyPI release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lares_agent_trigger"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
# D100/D104 pin the module/package docstring convention; the rest of the D
# family is intentionally off (per-function docstrings are judged in review).
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "D100", "D104", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # pytest fixtures injected for setup side-effects

[tool.mypy]
python_version = "3.15"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["nats", "nats.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
