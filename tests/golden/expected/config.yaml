# generated by `task agents:create-harness-config`, do not edit
# The hand-written settings.yaml first, then the part rendered from use-cases.yaml.

# Hand-written Hermes settings: everything the generator does not own.

# Codex first, Grok when it fails.
model:
  provider: openai-codex
  default: gpt-6-sol

agent:
  disabled_toolsets:
    - terminal
    # Switched on by any explicit Discord list; stays off.
    - discord

# Rendered from use-cases.yaml: what each surface may hold, the tool servers,
# and the hook that reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
    - lares-control
  api_server:
    - lares
  cron:
    - hermes-cron
    - lares
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_MCP_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_current_knx
        - get_episode
        - query_*
        - correlate_events
        - search_wiki
  lares-control:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_CONTROL_KEY}
    timeout: 30
    tools:
      include:
        - request_knx_write
        - get_write_request
  lares-memory:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_MEMORY_KEY}
    timeout: 60
    tools:
      include:
        - append_memory
