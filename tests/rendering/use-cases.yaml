# Every surface once: a chat with a request server and GitHub's reads, an
# event, a schedule that reads and keeps its memory through the cron surface,
# a dormant schedule naming a writing server nothing else uses, a connector a
# person signs in to, and speech to text with a client besides the profiles.

ledger_hook:
  trigger_url: http://lares-agent-trigger.agents.svc.cluster.local:8080
  secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET

gateway:
  url: http://agentgateway.agents.svc.cluster.local:8080
  otlp_endpoint: http://alloy-alloy-receiver.alloy.svc.cluster.local:4318
  key_env: GATEWAY_KEY

tool_servers:
  - name: lares
    kind: http
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    credential: {secret: agentgateway-keys, key: lares-mcp-bridge, header: Authorization}
    timeout_seconds: 60
    access: read
    tools: [list_*, get_current_knx, get_episode, query_*, correlate_events, search_wiki]

  - name: lares-control
    kind: http
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    credential: {secret: agentgateway-keys, key: lares-mcp-bridge, header: Authorization}
    timeout_seconds: 30
    access: request
    tools: [request_knx_write, get_write_request]

  - name: lares-memory
    kind: http
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    credential: {secret: agentgateway-keys, key: lares-mcp-bridge, header: Authorization}
    timeout_seconds: 30
    access: memory
    tools: [get_memory, append_memory]

  - name: lares-wiki
    kind: http
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    credential: {secret: agentgateway-keys, key: lares-mcp-bridge, header: Authorization}
    timeout_seconds: 60
    access: write
    tools: [update_wiki_page]

  - name: github
    kind: http
    url: http://github-mcp-server.agents.svc.cluster.local:8082/mcp
    credential:
      secret: github-mcp-server-token
      key: token
      header: Authorization
    timeout_seconds: 60
    access: read
    tools: [get_*, list_*, search_*, issue_read, pull_request_read]

connectors:
  - name: claude-ai
    path: /mcp
    issuer: ${AUTHENTIK_URL}/application/o/claude-ai/
    client_id: claude-ai
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    credential: {secret: agentgateway-keys, key: lares-mcp-bridge, header: Authorization}
    timeout_seconds: 60
    tools: ["*"]

speech:
  url: https://api.openai.com
  credential: {secret: agentgateway-keys, key: openai-api-key, header: Authorization}
  timeout_seconds: 60
  clients:
    - name: open-webui
      key: {secret: agentgateway-keys, key: open-webui-gateway-key}

scripts:
  - name: skill-digest
    sentence: Posts the week's skill names per profile to the home channel.
    trigger:
      kind: schedule
      cron: "0 18 * * 0"
    script: skill-digest.py
    deliver: discord
    enabled: true

  - name: volume-report
    sentence: Reports how full the data volume is.
    trigger:
      kind: schedule
      cron: "0 7 * * 1"
    script: volume-report.sh
    deliver: discord
    dormant: Waits for its script.

use_cases:
  - name: messenger
    sentence: Answers a message from the phone.
    trigger:
      kind: message
    tools: [lares, lares-control, github]
    output: [discord, web_chat]
    budget: {tool_calls: 40, minutes: 10, runs_per_day: 200}
    language: de
    memory: true
    enabled: true

  - name: explain-episode
    sentence: Explains a new or escalated episode on its own event.
    trigger:
      kind: event
      source: episode
      filter: {appeared: 2, escalated: 2}
    skill: lares-explain
    tools: [lares]
    output: [stored, discord, mail]
    budget: {tool_calls: 40, minutes: 10, runs_per_day: 10}
    language: de
    memory: false
    enabled: true

  - name: propose-faults
    sentence: Proposes changes to the fault list as pull requests.
    trigger:
      kind: schedule
      cron: "0 3 * * 0"
    skill: lares-propose
    tools: [lares, lares-memory]
    output: [github_pr]
    budget: {tool_calls: 80, minutes: 20, runs_per_day: 1}
    language: en
    memory: true
    enabled: true

  - name: basalte-prose
    sentence: Writes the prose for the logic blocks.
    trigger:
      kind: schedule
      cron: "0 4 * * 6"
    skill: lares-basalte-prose
    tools: [lares, lares-wiki]
    output: [wiki_page]
    budget: {tool_calls: 60, minutes: 15, runs_per_day: 1}
    language: de
    memory: false
    dormant: Waits for the wiki write key.
