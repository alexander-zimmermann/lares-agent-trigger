# generated by `task agents:create-harness-config`, do not edit
# An additional values file of the gateway's chart: its routes, which the chart joins
# to lares's own settings in one config file, the routes' keys as variables, and every
# credential they attach, mounted whole so a renewed one reaches the gateway. A key is
# a variable the gateway expands at start, set from hermes-credentials or a speech
# client's Secret, as is a connector's issuer; a resealed key rolls the gateway, a
# changed route reloads without a restart.
config:
  frontendPolicies:
    tracing:
      host: alloy-alloy-receiver.alloy.svc.cluster.local:4318
      protocol: http
      randomSampling: ${TRACING_SAMPLING_RATIO}
      attributes:
        enduser.id: default(apiKey.enduser_id, jwt.preferred_username)
  binds:
    - port: 8080
      listeners:
        - routes:
            - name: lares
              matches:
                - path:
                    exact: /mcp/lares
              policies:
                apiKey:
                  mode: strict
                  keys:
                    - key: ${GATEWAY_KEY}
                    - key: ${KIM_GATEWAY_KEY}
                      metadata:
                        enduser_id: kim
                    - key: ${LOU_GATEWAY_KEY}
                      metadata:
                        enduser_id: lou
                mcpAuthorization:
                  rules:
                    - mcp.tool.name.startsWith("list_")
                    - mcp.tool.name == "get_current_knx"
                    - mcp.tool.name == "get_episode"
                    - mcp.tool.name.startsWith("query_")
                    - mcp.tool.name == "correlate_events"
                    - mcp.tool.name == "search_wiki"
                backendAuth:
                  key:
                    value:
                      file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
              backends:
                - mcp:
                    statefulMode: stateless
                    targets:
                      - name: lares
                        mcp:
                          host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                        policies:
                          http:
                            requestTimeout: 60s
                          transformations:
                            request:
                              set:
                                X-Client-Id: '"lares"'
                                X-Enduser-Id: apiKey.enduser_id
            - name: lares-control
              matches:
                - path:
                    exact: /mcp/lares-control
              policies:
                apiKey:
                  mode: strict
                  keys:
                    - key: ${KIM_GATEWAY_KEY}
                      metadata:
                        enduser_id: kim
                mcpAuthorization:
                  rules:
                    - mcp.tool.name == "request_knx_write"
                    - mcp.tool.name == "get_write_request"
                backendAuth:
                  key:
                    value:
                      file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
              backends:
                - mcp:
                    statefulMode: stateless
                    targets:
                      - name: lares-control
                        mcp:
                          host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                        policies:
                          http:
                            requestTimeout: 30s
                          transformations:
                            request:
                              set:
                                X-Client-Id: '"lares-control"'
                                X-Enduser-Id: apiKey.enduser_id
            - name: lares-memory
              matches:
                - path:
                    exact: /mcp/lares-memory
              policies:
                apiKey:
                  mode: strict
                  keys:
                    - key: ${GATEWAY_KEY}
                mcpAuthorization:
                  rules:
                    - mcp.tool.name == "get_memory"
                    - mcp.tool.name == "append_memory"
                backendAuth:
                  key:
                    value:
                      file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
              backends:
                - mcp:
                    statefulMode: stateless
                    targets:
                      - name: lares-memory
                        mcp:
                          host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                        policies:
                          http:
                            requestTimeout: 30s
                          transformations:
                            request:
                              set:
                                X-Client-Id: '"lares-memory"'
                                X-Enduser-Id: apiKey.enduser_id
            - name: github
              matches:
                - path:
                    exact: /mcp/github
              policies:
                apiKey:
                  mode: strict
                  keys:
                    - key: ${KIM_GATEWAY_KEY}
                      metadata:
                        enduser_id: kim
                mcpAuthorization:
                  rules:
                    - mcp.tool.name.startsWith("get_")
                    - mcp.tool.name.startsWith("list_")
                    - mcp.tool.name.startsWith("search_")
                    - mcp.tool.name == "issue_read"
                    - mcp.tool.name == "pull_request_read"
                backendAuth:
                  key:
                    value:
                      file: /etc/agentgateway/credentials/github-mcp-server-token/token
              backends:
                - mcp:
                    statefulMode: stateless
                    targets:
                      - name: github
                        mcp:
                          host: http://github-mcp-server.agents.svc.cluster.local:8082/mcp
                        policies:
                          http:
                            requestTimeout: 60s
                          transformations:
                            request:
                              set:
                                X-Client-Id: '"github"'
                                X-Enduser-Id: apiKey.enduser_id
            - name: claude-ai
              matches:
                - path:
                    exact: /mcp
                - path:
                    exact: /.well-known/oauth-protected-resource/mcp
                - path:
                    exact: /.well-known/oauth-authorization-server/mcp
                - path:
                    exact: /.well-known/oauth-authorization-server/mcp/client-registration
              policies:
                mcpAuthentication:
                  issuer: ${AUTHENTIK_URL}/application/o/claude-ai/
                  audiences:
                    - claude-ai
                  provider:
                    authentik: {}
                  clientId: claude-ai
                  resourceMetadata:
                    scopesSupported:
                      - openid
                      - profile
                      - email
                      - offline_access
                    bearerMethodsSupported:
                      - header
                mcpAuthorization:
                  rules:
                    - mcp.tool.name.startsWith("")
                backendAuth:
                  key:
                    value:
                      file: /etc/agentgateway/credentials/agentgateway-keys/lares-mcp-bridge
              backends:
                - mcp:
                    statefulMode: stateless
                    targets:
                      - name: claude-ai
                        mcp:
                          host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                        policies:
                          http:
                            requestTimeout: 60s
                          transformations:
                            request:
                              set:
                                X-Client-Id: '"claude-ai"'
                                X-Enduser-Id: jwt.preferred_username
                  policies:
                    authorization:
                      rules:
                        - jwt.preferred_username in ["kim"]
            - name: speech
              matches:
                - path:
                    exact: /v1/audio/transcriptions
              policies:
                apiKey:
                  mode: strict
                  keys:
                    - key: ${GATEWAY_KEY}
                    - key: ${KIM_GATEWAY_KEY}
                      metadata:
                        enduser_id: kim
                    - key: ${LOU_GATEWAY_KEY}
                      metadata:
                        enduser_id: lou
                    - key: ${OPEN_WEBUI_GATEWAY_KEY}
                      metadata:
                        enduser_id: open-webui
                backendAuth:
                  key:
                    value:
                      file: /etc/agentgateway/credentials/agentgateway-keys/openai-api-key
                ai:
                  routes:
                    /v1/audio/transcriptions: detect
              backends:
                - ai:
                    name: openai
                    provider:
                      openAI: {}
                    hostOverride: api.openai.com:443
                    policies:
                      backendTLS: {}
                      http:
                        requestTimeout: 60s
podAnnotations:
  secret.reloader.stakater.com/reload: hermes-credentials,agentgateway-keys
extraEnv:
  - name: GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: gateway-key
  - name: KIM_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: kim-gateway-key
  - name: LOU_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-credentials
        key: lou-gateway-key
  - name: OPEN_WEBUI_GATEWAY_KEY
    valueFrom:
      secretKeyRef:
        name: agentgateway-keys
        key: open-webui-gateway-key
extraVolumes:
  - name: agentgateway-keys
    secret:
      secretName: agentgateway-keys
      items:
        - key: lares-mcp-bridge
          path: lares-mcp-bridge
        - key: openai-api-key
          path: openai-api-key
  - name: github-mcp-server-token
    secret:
      secretName: github-mcp-server-token
      items:
        - key: token
          path: token
extraVolumeMounts:
  - name: agentgateway-keys
    mountPath: /etc/agentgateway/credentials/agentgateway-keys
    readOnly: true
  - name: github-mcp-server-token
    mountPath: /etc/agentgateway/credentials/github-mcp-server-token
    readOnly: true
