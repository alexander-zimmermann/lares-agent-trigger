# generated by `task agents:create-harness-config`, do not edit
# An additional values file of the gateway's chart: its routes and the Secret of each
# credential they attach, mounted whole so a renewed one reaches the gateway.
config:
  config:
    localXdsPath: /etc/agentgateway/routes/config.yaml
extraVolumes:
  - name: routes
    secret:
      secretName: agentgateway-routes
      items:
        - key: config.yaml
          path: config.yaml
  - name: github-mcp-server-token
    secret:
      secretName: github-mcp-server-token
      items:
        - key: token
          path: token
extraVolumeMounts:
  - name: routes
    mountPath: /etc/agentgateway/routes
    readOnly: true
  - name: github-mcp-server-token
    mountPath: /etc/agentgateway/credentials/github-mcp-server-token
    readOnly: true
