# generated by `task agents:create-harness-config`, do not edit
# An Authentik blueprint: every person of persons.yaml, enabled or dormant, as
# an internal account at users/household named by the handle, a member of
# household and of a group person-<handle> of their own. A dormant person's
# account is inactive; an enabled one's is never set active, so a hand lock
# holds. No account loses a group of its own; the owner's is only created.
version: 1
metadata:
  name: persons
  labels:
    blueprints.goauthentik.io/instantiate: 'true'
entries:
