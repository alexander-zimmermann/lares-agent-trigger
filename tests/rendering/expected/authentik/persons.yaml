    state: created
    id: kim
    identifiers:
      username: kim
    attrs:
      name: kim
      type: internal
      path: users/household
  - model: authentik_core.user
    state: present
    id: lou
    identifiers:
      username: lou
    attrs:
      name: lou
      type: internal
      path: users/household
  - model: authentik_core.user
    state: present
    id: max
    identifiers:
      username: max
    attrs:
      name: max
      type: internal
      path: users/household
      is_active: false
  - model: authentik_core.group
    state: present
    identifiers:
      name: household
    attrs:
      users:
        - !KeyOf 'kim'
        - !KeyOf 'lou'
        - !KeyOf 'max'
  - model: authentik_core.group
    state: present
    identifiers:
      name: person-kim
    attrs:
