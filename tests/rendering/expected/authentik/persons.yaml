# generated by `task agents:create-harness-config`, do not edit
# An Authentik blueprint: every person of persons.yaml, enabled or dormant, as
# an internal account at users/household named by the handle and a member of
# household. A dormant person's account is inactive; an enabled one's is never
# set active, so a hand lock holds. Membership is set on the group, so an
# account keeps its other groups; the owner's account is only created.
version: 1
metadata:
  name: persons
  labels:
    blueprints.goauthentik.io/instantiate: 'true'
entries:
  - model: authentik_core.user
    state: created
    id: kim
    identifiers:
      username: kim
    attrs:
      name: kim
      type: internal
      path: users/household
  - model: authentik_core.user
    state: present
    id: lou
    identifiers:
      username: lou
    attrs:
      name: lou
      type: internal
      path: users/household
  - model: authentik_core.user
    state: present
    id: max
    identifiers:
      username: max
    attrs:
      name: max
      type: internal
      path: users/household
      is_active: false
  - model: authentik_core.group
    state: present
    identifiers:
      name: household
    attrs:
      users:
        - !KeyOf 'kim'
        - !KeyOf 'lou'
        - !KeyOf 'max'
