# generated by `task agents:create-harness-config`, do not edit
# kim's profile: the hand-written settings.yaml first, then the parts
# rendered from persons.yaml and use-cases.yaml.

# Hand-written Hermes settings: everything the generator does not own.

agent:
  disabled_toolsets:
    - terminal
    # Switched on by any explicit Discord list; stays off.
    - discord

# One gateway serves every profile.
gateway:
  multiplex_profiles: true

discord:
  # In a channel, only when mentioned.
  require_mention: true

# Rendered from persons.yaml: kim's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
  - provider: openai-api
    model: gpt-5.6-terra
terminal:
  cwd: /opt/data/profiles/kim

# Rendered from persons.yaml and use-cases.yaml: kim's tool servers on
# Discord and the API server, and the hook that reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
    - lares-control
    - github
  api_server:
    - lares
    - lares-control
    - github
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_MCP_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_current_knx
        - get_episode
        - query_*
        - correlate_events
        - search_wiki
  lares-control:
    url: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
    headers:
      Authorization: Bearer ${env:LARES_CONTROL_KEY}
    timeout: 30
    tools:
      include:
        - request_knx_write
        - get_write_request
  github:
    command: /opt/github-mcp/github-mcp-server
    args:
      - stdio
      - --read-only
      - --toolsets=repos,issues,pull_requests
    env:
      GITHUB_APP_ID: '1234567'
      GITHUB_APP_INSTALLATION_ID: '89012345'
      GITHUB_APP_PRIVATE_KEY_PATH: /etc/github-reader/private-key
    timeout: 60
    tools:
      include:
        - get_*
        - list_*
        - search_*
        - issue_read
        - pull_request_read
      resources: false
      prompts: false
