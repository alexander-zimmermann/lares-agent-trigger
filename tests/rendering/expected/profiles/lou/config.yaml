# generated by `task agents:create-harness-config`, do not edit
# lou's profile: rendered from persons.yaml and use-cases.yaml. The
# hand-written settings.yaml is the managed scope, /etc/hermes/config.yaml,
# which Hermes reads over this file.

# Rendered from persons.yaml: lou's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-luna
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
terminal:
  cwd: /opt/data/profiles/lou

# Rendered from persons.yaml and use-cases.yaml: lou's tool servers on
# Discord and the API server, the web chat's skill tools, and the hook that
# reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - lares
  api_server:
    - skills
    - lares
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - api_request_error
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_current_knx
        - get_episode
        - query_*
        - correlate_events
        - search_wiki
      resources: false
      prompts: false
