# generated by `task agents:create-harness-config`, do not edit
# An additional values file of Hermes's chart: each person's config and .env, the
# persons' SOUL.md, AGENTS.md and the marker that keeps the bundled skills out,
# each mounted read-only into the person's profile, and the container that
# streams the profile's agent.log for Loki. Every plugin settings.yaml enables is
# the ConfigMap of its name, mounted read-only as its directory in every profile.
deployment:
  volumes:
    hermes-session-reset-policy:
      configMap:
        name: hermes-session-reset-policy
    hermes-kim-env:
      secret:
        secretName: hermes-credentials
        items:
          - key: kim.env
            path: .env
    hermes-kim-config:
      configMap:
        name: hermes-profiles
        items:
          - key: kim
            path: config.yaml
    hermes-kim-soul:
      configMap:
        name: hermes-config
        items:
          - key: persons-SOUL.md
            path: SOUL.md
    hermes-kim-agents:
      configMap:
        name: hermes-config
        items:
          - key: AGENTS.md
            path: AGENTS.md
    hermes-kim-no-bundled-skills:
      configMap:
        name: hermes-config
        items:
          - key: .no-bundled-skills
            path: .no-bundled-skills
    hermes-kim-hermes-session-reset-policy:
      configMap:
        name: hermes-session-reset-policy
    hermes-lou-env:
      secret:
        secretName: hermes-credentials
        items:
          - key: lou.env
            path: .env
    hermes-lou-config:
      configMap:
        name: hermes-profiles
        items:
          - key: lou
            path: config.yaml
    hermes-lou-soul:
      configMap:
        name: hermes-config
        items:
          - key: persons-SOUL.md
            path: SOUL.md
    hermes-lou-agents:
      configMap:
        name: hermes-config
        items:
          - key: AGENTS.md
            path: AGENTS.md
    hermes-lou-no-bundled-skills:
      configMap:
        name: hermes-config
        items:
          - key: .no-bundled-skills
            path: .no-bundled-skills
    hermes-lou-hermes-session-reset-policy:
      configMap:
        name: hermes-session-reset-policy
  volumeMounts:
    hermes-session-reset-policy:
      mountPath: /opt/data/plugins/hermes-session-reset-policy
      readOnly: true
    hermes-kim-env:
      mountPath: /opt/data/profiles/kim/.env
      subPath: .env
      readOnly: true
    hermes-kim-config:
      mountPath: /opt/data/profiles/kim/config.yaml
      subPath: config.yaml
      readOnly: true
    hermes-kim-soul:
      mountPath: /opt/data/profiles/kim/SOUL.md
      subPath: SOUL.md
      readOnly: true
    hermes-kim-agents:
      mountPath: /opt/data/profiles/kim/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    hermes-kim-no-bundled-skills:
      mountPath: /opt/data/profiles/kim/.no-bundled-skills
      subPath: .no-bundled-skills
      readOnly: true
    hermes-kim-hermes-session-reset-policy:
      mountPath: /opt/data/profiles/kim/plugins/hermes-session-reset-policy
      readOnly: true
    hermes-lou-env:
      mountPath: /opt/data/profiles/lou/.env
      subPath: .env
      readOnly: true
    hermes-lou-config:
      mountPath: /opt/data/profiles/lou/config.yaml
      subPath: config.yaml
      readOnly: true
    hermes-lou-soul:
      mountPath: /opt/data/profiles/lou/SOUL.md
      subPath: SOUL.md
      readOnly: true
    hermes-lou-agents:
      mountPath: /opt/data/profiles/lou/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    hermes-lou-no-bundled-skills:
      mountPath: /opt/data/profiles/lou/.no-bundled-skills
      subPath: .no-bundled-skills
      readOnly: true
    hermes-lou-hermes-session-reset-policy:
      mountPath: /opt/data/profiles/lou/plugins/hermes-session-reset-policy
      readOnly: true
  additionalContainers:
    agent-log-kim:
      image: agent-log
      command:
        - tail
        - -n
        - '0'
        - -F
        - /opt/data/profiles/kim/logs/agent.log
      volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
          readOnly: true
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    agent-log-lou:
      image: agent-log
      command:
        - tail
        - -n
        - '0'
        - -F
        - /opt/data/profiles/lou/logs/agent.log
      volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
          readOnly: true
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
