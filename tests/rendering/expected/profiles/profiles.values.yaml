# generated by `task agents:create-harness-config`, do not edit
# An additional values file of Hermes's chart: each person's config and .env, the
# persons' SOUL.md, AGENTS.md and the marker that keeps the bundled skills out,
# each mounted read-only into the person's profile.
deployment:
  volumes:
    hermes-kim-env:
      secret:
        secretName: hermes-credentials
        items:
          - key: kim.env
            path: .env
    hermes-kim-config:
      configMap:
        name: hermes-profiles
        items:
          - key: kim
            path: config.yaml
    hermes-kim-soul:
      configMap:
        name: hermes-config
        items:
          - key: persons-SOUL.md
            path: SOUL.md
    hermes-kim-agents:
      configMap:
        name: hermes-config
        items:
          - key: AGENTS.md
            path: AGENTS.md
    hermes-kim-no-bundled-skills:
      configMap:
        name: hermes-config
        items:
          - key: .no-bundled-skills
            path: .no-bundled-skills
    hermes-lou-env:
      secret:
        secretName: hermes-credentials
        items:
          - key: lou.env
            path: .env
    hermes-lou-config:
      configMap:
        name: hermes-profiles
        items:
          - key: lou
            path: config.yaml
    hermes-lou-soul:
      configMap:
        name: hermes-config
        items:
          - key: persons-SOUL.md
            path: SOUL.md
    hermes-lou-agents:
      configMap:
        name: hermes-config
        items:
          - key: AGENTS.md
            path: AGENTS.md
    hermes-lou-no-bundled-skills:
      configMap:
        name: hermes-config
        items:
          - key: .no-bundled-skills
            path: .no-bundled-skills
  volumeMounts:
    hermes-kim-env:
      mountPath: /opt/data/profiles/kim/.env
      subPath: .env
      readOnly: true
    hermes-kim-config:
      mountPath: /opt/data/profiles/kim/config.yaml
      subPath: config.yaml
      readOnly: true
    hermes-kim-soul:
      mountPath: /opt/data/profiles/kim/SOUL.md
      subPath: SOUL.md
      readOnly: true
    hermes-kim-agents:
      mountPath: /opt/data/profiles/kim/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    hermes-kim-no-bundled-skills:
      mountPath: /opt/data/profiles/kim/.no-bundled-skills
      subPath: .no-bundled-skills
      readOnly: true
    hermes-lou-env:
      mountPath: /opt/data/profiles/lou/.env
      subPath: .env
      readOnly: true
    hermes-lou-config:
      mountPath: /opt/data/profiles/lou/config.yaml
      subPath: config.yaml
      readOnly: true
    hermes-lou-soul:
      mountPath: /opt/data/profiles/lou/SOUL.md
      subPath: SOUL.md
      readOnly: true
    hermes-lou-agents:
      mountPath: /opt/data/profiles/lou/AGENTS.md
      subPath: AGENTS.md
      readOnly: true
    hermes-lou-no-bundled-skills:
      mountPath: /opt/data/profiles/lou/.no-bundled-skills
      subPath: .no-bundled-skills
      readOnly: true
