# generated by `task agents:create-harness-config`, do not edit
# The cron jobs the harness runs, one per enabled schedule use case and one per enabled script.
jobs:
  - name: lares:propose-faults
    schedule: 0 3 * * 0
    skills:
      - lares-propose
    prompt: Answer in English. Stay within 80 tool calls and 20 minutes.
    deliver: local
  - name: lares:skill-digest
    schedule: 0 18 * * 0
    script: skill-digest.py
    no_agent: true
    deliver: discord
