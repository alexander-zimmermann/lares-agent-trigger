# generated by `task agents:create-harness-config`, do not edit
# An additional values file of Open WebUI's chart: one connection per enabled
# person, to their profile on the harness's API server under their own key,
# sealed in open-webui-hermes-keys. Each serves the handle as its one model and
# names the chat as the profile's session; the chart renders every value as a
# template, so the chat id's placeholder is quoted for it.
commonEnvVars:
  - name: HERMES_KEY_KIM
    valueFrom:
      secretKeyRef:
        name: open-webui-hermes-keys
        key: kim-api-server-key
  - name: HERMES_KEY_LOU
    valueFrom:
      secretKeyRef:
        name: open-webui-hermes-keys
        key: lou-api-server-key
  - name: OPENAI_API_BASE_URLS
    value: http://hermes.agents.svc.cluster.local:8642/p/kim/v1;http://hermes.agents.svc.cluster.local:8642/p/lou/v1
  - name: OPENAI_API_KEYS
    value: $(HERMES_KEY_KIM);$(HERMES_KEY_LOU)
  - name: OPENAI_API_CONFIGS
    value: '{"0":{"model_ids":["kim"],"headers":{"X-Hermes-Session-Id":"{{`{{CHAT_ID}}`}}"}},"1":{"model_ids":["lou"],"headers":{"X-Hermes-Session-Id":"{{`{{CHAT_ID}}`}}"}}}'
