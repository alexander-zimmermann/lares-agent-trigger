# generated by `task agents:create-harness-config`, do not edit
# The hand-written settings.yaml first, then the parts rendered from persons.yaml
# and use-cases.yaml.

# Hand-written Hermes settings: everything the generator does not own.

agent:
  disabled_toolsets:
    - terminal
    # Switched on by any explicit Discord list; stays off.
    - discord

# One gateway serves every profile.
gateway:
  multiplex_profiles: true
  # Rendered from persons.yaml: each Discord person's messages go to their profile.
  profile_routes:
    - name: kim
      platform: discord
      user_id: ${env:DISCORD_USER_KIM}
      profile: kim
    - name: lou
      platform: discord
      user_id: ${env:DISCORD_USER_LOU}
      profile: lou

discord:
  # In a channel, only when mentioned.
  require_mention: true
  # Rendered from persons.yaml: who may write to the bot, who runs every command,
  # and what everyone else may run.
  allow_from:
    - ${env:DISCORD_USER_KIM}
    - ${env:DISCORD_USER_LOU}
  allow_admin_from:
    - ${env:DISCORD_USER_KIM}
  group_allow_admin_from:
    - ${env:DISCORD_USER_KIM}
  user_allowed_commands:
    - reset
    - stop
    - retry
    - undo
  group_user_allowed_commands:
    - reset
    - stop
    - retry
    - undo

# Rendered from persons.yaml: the default profile's source, its fallbacks in order,
# and the profile's directory, where Hermes discovers the context files.
model:
  provider: openai-codex
  default: gpt-6-sol
fallback_providers:
  - provider: openai-api
    model: gpt-6-luna
  - provider: openai-api
    model: gpt-5.6-terra
terminal:
  cwd: /opt/data

# Rendered from use-cases.yaml: what each surface may hold, the tool servers,
# and the hook that reports every finished turn.
platform_toolsets:
  discord:
    - hermes-discord
    - no_mcp
  api_server:
    - lares
  cron:
    - hermes-cron
    - lares
    - lares-memory
hooks:
  outbound:
    - name: lares-agent-trigger
      url: http://lares-agent-trigger.agents.svc.cluster.local:8080/hooks/hermes
      events:
        - post_api_request
        - post_tool_call
        - on_session_end
      secret_env: LARES_AGENT_TRIGGER_HOOK_SECRET
      timeout: 10
mcp_servers:
  lares:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares
    headers:
      Authorization: Bearer ${env:LARES_GATEWAY_KEY}
    timeout: 60
    tools:
      include:
        - list_*
        - get_current_knx
        - get_episode
        - query_*
        - correlate_events
        - search_wiki
      resources: false
      prompts: false
  lares-memory:
    url: http://agentgateway.agents.svc.cluster.local:8080/mcp/lares-memory
    headers:
      Authorization: Bearer ${env:LARES_MEMORY_GATEWAY_KEY}
    timeout: 30
    tools:
      include:
        - get_memory
        - append_memory
      resources: false
      prompts: false
