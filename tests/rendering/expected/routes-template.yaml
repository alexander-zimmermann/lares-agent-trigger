# generated by `task agents:create-harness-config`, do not edit
# The gateway's routes, composed from the keys sealed one by one in
# sealed-secret.yaml: each profile's key under the name its .env reads it from,
# each bridge client's under the client's name.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: agentgateway-routes
  namespace: agents
spec:
  template:
    data:
      config.yaml: |
        frontendPolicies:
          tracing:
            host: alloy-alloy-receiver.alloy.svc.cluster.local:4318
            protocol: http
            randomSampling: '0.5'
        binds:
          - port: 8080
            listeners:
              - routes:
                  - name: lares
                    matches:
                      - path:
                          exact: /mcp/lares
                    policies:
                      apiKey:
                        mode: strict
                        keys:
                          - key: {{ index . "lares-gateway-key" | toJson }}
                      mcpAuthorization:
                        rules:
                          - mcp.tool.name.startsWith("list_")
                          - mcp.tool.name == "get_current_knx"
                          - mcp.tool.name == "get_episode"
                          - mcp.tool.name.startsWith("query_")
                          - mcp.tool.name == "correlate_events"
                          - mcp.tool.name == "search_wiki"
                      backendAuth:
                        key:
                          value: {{ index . "lares-agent" | toJson }}
                    backends:
                      - mcp:
                          statefulMode: stateless
                          targets:
                            - name: lares
                              mcp:
                                host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                  - name: lares-kim
                    matches:
                      - path:
                          exact: /mcp/lares-kim
                    policies:
                      apiKey:
                        mode: strict
                        keys:
                          - key: {{ index . "kim-lares-gateway-key" | toJson }}
                      mcpAuthorization:
                        rules:
                          - mcp.tool.name.startsWith("list_")
                          - mcp.tool.name == "get_current_knx"
                          - mcp.tool.name == "get_episode"
                          - mcp.tool.name.startsWith("query_")
                          - mcp.tool.name == "correlate_events"
                          - mcp.tool.name == "search_wiki"
                      backendAuth:
                        key:
                          value: {{ index . "kim" | toJson }}
                    backends:
                      - mcp:
                          statefulMode: stateless
                          targets:
                            - name: lares
                              mcp:
                                host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                  - name: lares-lou
                    matches:
                      - path:
                          exact: /mcp/lares-lou
                    policies:
                      apiKey:
                        mode: strict
                        keys:
                          - key: {{ index . "lou-lares-gateway-key" | toJson }}
                      mcpAuthorization:
                        rules:
                          - mcp.tool.name.startsWith("list_")
                          - mcp.tool.name == "get_current_knx"
                          - mcp.tool.name == "get_episode"
                          - mcp.tool.name.startsWith("query_")
                          - mcp.tool.name == "correlate_events"
                          - mcp.tool.name == "search_wiki"
                      backendAuth:
                        key:
                          value: {{ index . "lou" | toJson }}
                    backends:
                      - mcp:
                          statefulMode: stateless
                          targets:
                            - name: lares
                              mcp:
                                host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                  - name: lares-control
                    matches:
                      - path:
                          exact: /mcp/lares-control
                    policies:
                      apiKey:
                        mode: strict
                        keys:
                          - key: {{ index . "kim-lares-control-gateway-key" | toJson }}
                      mcpAuthorization:
                        rules:
                          - mcp.tool.name == "request_knx_write"
                          - mcp.tool.name == "get_write_request"
                      backendAuth:
                        key:
                          value: {{ index . "lares-control" | toJson }}
                    backends:
                      - mcp:
                          statefulMode: stateless
                          targets:
                            - name: lares-control
                              mcp:
                                host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                  - name: lares-memory
                    matches:
                      - path:
                          exact: /mcp/lares-memory
                    policies:
                      apiKey:
                        mode: strict
                        keys:
                          - key: {{ index . "lares-memory-gateway-key" | toJson }}
                      mcpAuthorization:
                        rules:
                          - mcp.tool.name == "get_memory"
                          - mcp.tool.name == "append_memory"
                      backendAuth:
                        key:
                          value: {{ index . "lares-memory" | toJson }}
                    backends:
                      - mcp:
                          statefulMode: stateless
                          targets:
                            - name: lares-memory
                              mcp:
                                host: http://lares-mcp-bridge.lares-mcp-bridge.svc.cluster.local:8080/mcp
                  - name: github
                    matches:
                      - path:
                          exact: /mcp/github
                    policies:
                      apiKey:
                        mode: strict
                        keys:
                          - key: {{ index . "kim-github-gateway-key" | toJson }}
                      mcpAuthorization:
                        rules:
                          - mcp.tool.name.startsWith("get_")
                          - mcp.tool.name.startsWith("list_")
                          - mcp.tool.name.startsWith("search_")
                          - mcp.tool.name == "issue_read"
                          - mcp.tool.name == "pull_request_read"
                      backendAuth:
                        key:
                          value:
                            file: /etc/agentgateway/credentials/github-mcp-server-token/token
                    backends:
                      - mcp:
                          statefulMode: stateless
                          targets:
                            - name: github
                              mcp:
                                host: http://github-mcp-server.agents.svc.cluster.local:8082/mcp
